org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler can't relativize paths when a plugin's Kotlin
# sources live in the pub cache on C:\ while this project is on D:\ ("this and
# base files have different roots"). image_picker_android trips this. Disabling
# incremental Kotlin compilation sidesteps the cross-drive path computation.
kotlin.incremental=false
