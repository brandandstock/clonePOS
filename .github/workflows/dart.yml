# CI for the Clone-POS Flutter monorepo. The app lives in apps/staff_app and
# depends on packages/core + packages/widgets via path, so everything runs from
# that directory (there is no root pubspec.yaml — the default Dart starter
# workflow failed here because it ran `dart pub get` at the repo root).
name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/staff_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
